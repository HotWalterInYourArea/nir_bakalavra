version: '3.8'

services:
  # 1. Neo4j Database with Neosemantics (n10s) Plugin
  neo4j:
    image: neo4j:5.20-community # Recommended stable version for n10s
    container_name: neo4j-dbpedia
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password123 # CHANGE THIS PASSWORD
      # This is the magic line that installs the plugin automatically
      - NEO4JLABS_PLUGINS=["apoc", "n10s"]
      # Required for the n10s HTTP endpoint (mentioned in your previous setup)
      - NEO4J_server_unmanaged_extension_classes=n10s.endpoint=/rdf
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Ollama for Local LLM (Llama 3.1 or similar)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 3. Your Python Application
  app:
    build: . # Assumes you have a Dockerfile in the same directory
    container_name: gcr-experiment-app
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # Override the localhost URIs from your config.py to use the service names
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123 # Must match the Neo4j service password above
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=llama3.1
    volumes:
      # Mount your project so you can edit code without rebuilding
      - .:/app
    # Keep the container running so you can exec into it to run the pipeline
    command: tail -f /dev/null

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  ollama_models: